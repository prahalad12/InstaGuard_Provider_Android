apply plugin: 'com.android.application'
//Apply Google Services plugin
apply plugin: 'com.google.gms.google-services'
// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'
//Apply Secret Gradle plugin
//apply plugin: "com.google.secrets_gradle_plugin"

def fullApplicationName = "InstaGuard"
def fullApplicationName_source = "_provider"

def fullApplicationId = "com.instaguard.provider"
def fullVersionName = "1.3" // old 1.2
def fullVersionCode = 4 // old 3
//def fullBuildToolsVersion = "30.0.0"
def sdkVersion = 35
def minSdk = 25

//Push Notification
def work_version = "2.7.1"

android {

    compileSdkVersion sdkVersion
    //buildToolsVersion fullBuildToolsVersion
    defaultConfig {
        applicationId fullApplicationId
        minSdkVersion minSdk
        targetSdkVersion sdkVersion
        versionCode fullVersionCode
        versionName fullVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": android.defaultConfig.applicationId]
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }

        archivesBaseName = "$fullApplicationName$fullApplicationName_source-v$versionCode($versionName)"
        //signingConfig signingConfigs.debug

        Properties properties = new Properties();
        properties.load(project.rootProject.file("local.properties").newDataInputStream())
        buildConfigField "String", "API_KEY", "\"${properties.getProperty("API_KEY")}\""
        // Share the key with your `AndroidManifest.xml`
        manifestPlaceholders = [ API_KEY:"${properties.getProperty('API_KEY')}"]
        resConfigs 'fi', 'en', 'ar', 'si'


    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {

        }
    }

    useLibrary 'org.apache.http.legacy'
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }

    // view binding
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.instaguard.provider'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    //firebase
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    //Social Network
    implementation 'com.facebook.android:facebook-android-sdk:13.0.0'
    implementation "com.google.android.gms:play-services-auth:21.0.0"

    //Social Network
    /*implementation ('com.twitter.sdk.android:twitter:3.0.0@aar') {
        transitive = true
    }*/
    //Firebase & GeoFire
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-database:20.3.1'
    implementation 'com.firebase:geofire-android:3.2.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
        implementation 'com.google.firebase:firebase-auth:22.3.1'
    // FirebaseUI for Firebase Realtime Database
    implementation 'com.firebaseui:firebase-ui-database:8.0.2'

    // Arch
    implementation "android.arch.core:runtime:1.1.1"
    implementation "android.arch.core:common:1.1.1"

    //Dimension
